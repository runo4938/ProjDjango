<!DOCTYPE html>
<html lang="ru">
    <head>
        {% load static %}
        <link rel="shortcut icon"
              href="{% static 'favicon.ico' %}"
              type="image/x-icon">
        <meta charset="UTF-8">
        <title>Редактировать тарифы</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <style>/* From Uiverse.io by FColombati */</style>
    </head>
    <body class="container mt-4">
        <div class="row">
            <div class="card shadow">
                <div class="col-lg-12 mb-3">
                    <h2>Редактировать тарифы</h2>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary btn-lg">
                            <div class="button-outer">
                                <div class="button-inner">Сохранить</div>
                            </div>
                        </button>
                        <a href="{% url 'payment_form' %}" class="btn btn-secondary btn-lg">Назад</a>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
