<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            {% block title %}Учёт коммунальных услуг{% endblock %}
        </title>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
              rel="stylesheet" />
        <!-- Bootstrap 5 CSS -->
        {% load static %}
        <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
        {% comment %} <link href="static/css/bootstrap.min.css" rel="stylesheet"> {% endcomment %}
        <!-- https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
        <link rel="shortcut icon"
              href="{% static 'favicon.ico' %}"
              type="image/x-icon">
        <!-- Иконки Bootstrap -->
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
        <style>
            .table-container {
                max-height: 300px;
                /* Фиксированная высота контейнера */
                overflow-y: auto;
                /* Включаем прокрутку */
            }

            table thead th {
                position: sticky;
                top: 0;
                background: white;
                /* Чтобы текст не просвечивал */
                z-index: 10;
                /* Чтобы шапка была над содержимым */
            }

            .reading-section {
                background-color: #f8f9fa;
                border-radius: 10px;
                padding: 20px;
                margin-bottom: 30px;
            }

            .table-responsive {
                overflow-x: auto;
            }

            .card-body .row:first-child {
                margin-bottom: 0.5rem;
                /* Уменьшите значение по необходимости */
            }

            /*disign material*/
            .input-group {
                position: relative;
                margin: 20px;
                display: flex;
                gap: 0.625em; /* отступ между элементами */
            }

            .input-field {
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 18px;
                width: 200px;
            }

            .input-label {
                position: absolute;
                left: 10px;
                top: 10px;
                color: #999;
                font-size: 18px;
                pointer-events: none;
                transition: 0.2s ease all;
                background: white;
                padding: 0 5px;
            }

            .input-field:focus~.input-label,
            .input-field:not(:placeholder-shown)~.input-label {
                top: -10px;
                font-size: 14px;
                color: #4285f4;
            }

            .input-field:focus {
                border-color: #4285f4;
                outline: none;
            }
        </style>
    </head>
    <body class="bg-light">
        <div class="container py-5">
            {% block content %}
                {% load static %}
            {% endblock %}
        </div>
        <!-- Bootstrap 5 JS Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/js/toastr.min.js"></script>
    </body>
</html>
